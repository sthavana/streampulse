<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamPulse</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #fff; --line: #e3e3e7; --ink: #1b1b1f; --dim: #6b6b76;
    --ok: #1a7f4b; --warn: #9a6400; --crit: #b3261e; --info: #4a5568; --accent: #2f5fd0;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316; --panel: #1b1b20; --line: #2c2c33; --ink: #e9e9ec; --dim: #9a9aa5;
      --ok: #4ecb8d; --warn: #e0aa3e; --crit: #ff6b5e; --info: #a0aec0; --accent: #7aa2f7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }

  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; margin-bottom: 18px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  h1 small { font-weight: 400; color: var(--dim); font-size: 12px; margin-left: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; align-items: center; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 11px; font-size: 12px; white-space: nowrap;
  }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip.bad { border-color: var(--crit); color: var(--crit); }
  .chip.warn { border-color: var(--warn); color: var(--warn); }

  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
       margin: 26px 0 10px; font-weight: 600; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .card > .head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 11px 14px; }
  .card > .head .name { font-weight: 600; }
  .url { color: var(--dim); font-family: var(--mono); font-size: 11px; word-break: break-all; flex-basis: 100%; }

  .tag { font-size: 11px; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--dim); flex: none; }
  .dot.up { background: var(--ok); } .dot.down { background: var(--crit); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.name { font-family: var(--mono); font-size: 12px; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }

  .sev { font-size: 11px; padding: 1px 7px; border-radius: 5px; font-weight: 600; }
  .sev.critical { background: color-mix(in srgb, var(--crit) 15%, transparent); color: var(--crit); }
  .sev.warning  { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .sev.info     { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
  .msg { font-family: var(--mono); font-size: 11.5px; color: var(--dim); word-break: break-word; }
  .quiet { color: var(--dim); padding: 14px; font-size: 13px; }

  /* Picture and meter stack in one fixed-width cell so rows stay aligned. */
  .media { display: flex; flex-direction: column; gap: 4px; width: 92px; }
  .thumb {
    width: 92px; height: 52px; object-fit: cover; border-radius: 4px;
    border: 1px solid var(--line); background: #000; display: block;
  }
  .thumb-none {
    width: 92px; height: 52px; border-radius: 4px; border: 1px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--dim);
  }
  /* A meter, not a gauge: dBFS runs from silence at -60 to full scale at 0. */
  .meter { display: flex; align-items: center; gap: 5px; }
  .meter .bar { width: 44px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
  /* display:block, or width and height do not apply to an inline span. */
  .meter .fill { display: block; height: 100%; background: var(--ok); }
  .meter.silent .fill { background: var(--crit); }
  .meter .db { font-family: var(--mono); font-size: 10.5px; color: var(--dim); white-space: nowrap; }
  .meter.silent .db { color: var(--crit); font-weight: 600; }
  a.open { font-size: 11px; color: var(--accent); text-decoration: none; border: 1px solid var(--line);
           border-radius: 5px; padding: 1px 7px; white-space: nowrap; }
  a.open:hover { border-color: var(--accent); }
  .status-firing { color: var(--crit); font-weight: 600; }
  .status-resolved { color: var(--ok); font-weight: 600; }
  .stale { opacity: .45; }
  footer { margin-top: 30px; color: var(--dim); font-size: 11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>StreamPulse<small id="vantage"></small><small id="uptime"></small></h1>
    <div class="chips" id="chips"></div>
  </header>
  <div id="body"></div>
  <footer id="foot"></footer>
</div>

<script>
// Poll state, declared up here because the renderers read it.
let failures = 0;
let lastAt = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function secs(v) {
  if (v === undefined || v === null) return "";
  if (v < 1) return (v * 1000).toFixed(0) + "ms";
  if (v < 90) return v.toFixed(v < 10 ? 1 : 0) + "s";
  if (v < 5400) return (v / 60).toFixed(1) + "m";
  return (v / 3600).toFixed(1) + "h";
}
function ago(iso) {
  const d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 0) return "just now";
  if (d < 60) return d.toFixed(0) + "s ago";
  if (d < 3600) return (d / 60).toFixed(0) + "m ago";
  return (d / 3600).toFixed(1) + "h ago";
}
function num(v, digits = 0) {
  return v === undefined || v === null ? "" : v.toLocaleString(undefined, { maximumFractionDigits: digits });
}
const dot = (up) => up === null || up === undefined
  ? '<span class="dot" title="not observed yet"></span>'
  : `<span class="dot ${up ? "up" : "down"}" title="${up ? "reachable" : "unreachable"}"></span>`;

function chips(s) {
  const out = [];
  out.push(`<span class="chip">targets <b>${s.summary.targets_up}/${s.summary.targets}</b></span>`);
  out.push(`<span class="chip">streams <b>${s.summary.streams_up}/${s.summary.streams}</b></span>`);
  out.push(`<span class="chip${s.summary.firing ? " bad" : ""}">incidents <b>${s.summary.firing}</b></span>`);
  if (s.summary.suppressed) {
    out.push(`<span class="chip warn" title="held quiet by a maintenance window">suppressed <b>${s.summary.suppressed}</b></span>`);
  }
  out.push(`<span class="chip" id="tick">updated ${lastAt ? ago(lastAt) : "just now"}</span>`);
  return out.join("");
}

function incidents(list) {
  if (!list.length) return `<div class="card"><div class="quiet">Nothing firing.</div></div>`;
  const rows = list.map(i => `
    <tr>
      <td><span class="sev ${esc(i.severity)}">${esc(i.severity)}</span>${
        i.announced ? "" : ' <span class="tag" title="held quiet by a maintenance window">quiet</span>'}</td>
      <td class="name">${esc(i.check)}</td>
      <td class="name">${esc(i.target)}${i.variant ? " / " + esc(i.variant) : ""}</td>
      <td class="num">${i.count}</td>
      <td class="num">${ago(i.first_seen)}</td>
      <td class="msg">${esc(i.message)}</td>
    </tr>`).join("");
  return `<div class="card"><table>
    <thead><tr><th>severity</th><th>check</th><th>stream</th>
      <th class="num">seen</th><th class="num">since</th><th>latest message</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

// dBFS is logarithmic and runs from digital silence near -91 to full scale at
// 0. The meter shows -60..0, because below -60 there is nothing to see anyway.
function meter(a) {
  if (!a) return "";
  const pct = Math.max(0, Math.min(100, ((a.peak_dbfs + 60) / 60) * 100));
  return `<div class="meter${a.silent ? " silent" : ""}" title="peak ${a.peak_dbfs.toFixed(1)} dBFS, mean ${a.mean_dbfs.toFixed(1)} dBFS">
      <span class="bar"><span class="fill" style="width:${pct.toFixed(0)}%"></span></span>
      <span class="db">${a.silent ? "silent" : a.peak_dbfs.toFixed(0) + " dB"}</span>
    </div>`;
}

function thumb(st) {
  if (st.thumb) return `<img class="thumb" src="${esc(st.thumb)}" alt="latest frame from ${esc(st.name)}" loading="lazy">`;
  if (st.audio) return `<div class="thumb-none">audio</div>`;
  return `<div class="thumb-none"></div>`;
}

// showMedia is decided per *table*, not per row. A row that happens to have no
// picture this cycle -- an audio measurement that failed, a stream not captured
// yet -- must still render the cell, or its columns shift left out from under
// the header.
function streamRow(st, showMedia) {
  const m = st.metrics || {};
  const has = (k) => m[k] !== undefined;
  return `<tr>
    ${showMedia ? `<td><div class="media">${thumb(st)}${st.audio ? meter(st.audio) : ""}</div></td>` : ""}
    <td class="name">${dot(st.up)} ${esc(st.name)}${
      st.firing ? ` <span class="sev critical">${st.firing}</span>` : ""}</td>
    <td class="num">${has("segment_count") ? num(m.segment_count) : ""}</td>
    <td class="num">${has("playlist_window_seconds") ? secs(m.playlist_window_seconds) : ""}</td>
    <td class="num">${has("media_sequence") ? num(m.media_sequence) : ""}</td>
    <td class="num">${has("segment_ttfb_seconds") ? secs(m.segment_ttfb_seconds) : ""}</td>
    <td class="num">${has("init_segment_available") ? (m.init_segment_available ? "yes" : "NO") : ""}</td>
    <td class="num">${has("key_count") && m.key_count > 0 ? num(m.key_count) : ""}</td>
    <td class="num">${has("chunked_delivery") ? (m.chunked_delivery ? "yes" : "NO") : ""}</td>
  </tr>`;
}

function target(t) {
  const m = t.metrics || {};
  const anyMedia = t.streams.some(s => s.thumb || s.audio);
  const bits = [];
  if (m.manifest_fetch_seconds !== undefined) bits.push(`manifest ${secs(m.manifest_fetch_seconds)}`);
  if (m.manifest_age_seconds !== undefined) bits.push(`age ${secs(m.manifest_age_seconds)}`);
  if (m.manifest_cache_hit !== undefined) bits.push(m.manifest_cache_hit ? "cache HIT" : "cache MISS");
  if (m.variant_count !== undefined) bits.push(`${num(m.variant_count)} variants`);
  if (m.rendition_count) bits.push(`${num(m.rendition_count)} renditions`);
  if (m.representation_count !== undefined) bits.push(`${num(m.representation_count)} representations`);
  if (m.period_count > 1) bits.push(`${num(m.period_count)} periods`);

  const body = t.streams.length ? `<table>
      <thead><tr>${anyMedia ? "<th>picture</th>" : ""}<th>stream</th><th class="num">segs</th><th class="num">window</th>
        <th class="num">edge</th><th class="num">ttfb</th><th class="num">init</th>
        <th class="num">drm</th><th class="num">chunked</th></tr></thead>
      <tbody>${t.streams.map(s => streamRow(s, anyMedia)).join("")}</tbody></table>`
    : `<div class="quiet">No streams probed yet.</div>`;

  return `<div class="card">
    <div class="head">
      ${dot(t.up)}
      <span class="name">${esc(t.name)}</span>
      <span class="tag">${esc(t.format)}</span>
      ${t.live === null || t.live === undefined ? "" : `<span class="tag">${t.live ? "live" : "vod"}</span>`}
      <span class="tag">every ${esc(t.interval)}</span>
      ${t.firing ? `<span class="sev critical">${t.firing} firing</span>` : ""}
      <span class="tag" style="margin-left:auto">${esc(bits.join(" · "))}</span>
      <span class="url">${esc(t.url)} <a class="open" href="${esc(t.url)}" target="_blank" rel="noopener">open ↗</a></span>
    </div>
    ${body}
  </div>`;
}

function recent(list) {
  if (!list.length) return `<div class="card"><div class="quiet">No notifications yet. On a healthy stream that is the expected state.</div></div>`;
  const rows = list.map(f => `
    <tr>
      <td class="num">${ago(f.time)}</td>
      <td class="status-${esc(f.status || "firing")}">${esc(f.status || "firing")}</td>
      <td><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span></td>
      <td class="name">${esc(f.check)}</td>
      <td class="name">${esc(f.target)}${f.variant ? " / " + esc(f.variant) : ""}</td>
      <td class="msg">${esc(f.message)}</td>
    </tr>`).join("");
  return `<div class="card"><table>
    <thead><tr><th class="num">when</th><th>status</th><th>severity</th>
      <th>check</th><th>stream</th><th>message</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function render(s) {
  document.body.classList.remove("stale");
  $("chips").innerHTML = chips(s);
  $("uptime").textContent = s.uptime_seconds ? "up " + secs(s.uptime_seconds) : "";
  // Named in the header because a tab left open on the wrong region is
  // otherwise indistinguishable from the right one.
  $("vantage").textContent = s.vantage ? "from " + s.vantage : "";
  $("body").innerHTML =
    `<h2>Incidents</h2>${incidents(s.incidents || [])}` +
    `<h2>Targets</h2>${(s.targets || []).map(target).join("") ||
      `<div class="card"><div class="quiet">No targets configured.</div></div>`}` +
    `<h2>Recent notifications</h2>${recent(s.recent || [])}`;
  $("foot").textContent =
    "Deduplicated into incidents: a fault re-observed every poll appears once here, not once per poll. " +
    "Read-only, and unauthenticated — do not expose this port publicly.";
}

async function tick() {
  try {
    const r = await fetch("api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const state = await r.json();
    lastAt = state.now;
    render(state);
    failures = 0;
  } catch (e) {
    // Keep the last good view rather than blanking it: a prober that has just
    // been restarted is exactly when someone is looking at this page. One
    // missed poll is not worth reporting; two is.
    if (++failures > 1) {
      document.body.classList.add("stale");
      const t = $("tick");
      if (t) { t.textContent = "prober unreachable"; t.className = "chip bad"; }
    }
  }
}

// Refresh the age text every second so the page visibly keeps time even
// between polls -- a frozen "updated 0s ago" is how a dead dashboard looks.
setInterval(() => {
  const t = $("tick");
  if (t && !failures && lastAt) t.textContent = "updated " + ago(lastAt);
}, 1000);

tick();
setInterval(tick, 3000);
</script>
</body>
</html>
