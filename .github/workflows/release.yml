name: Release

# Attaches binaries to a release when a version tag is pushed.
#
# It exists because "clone it and build it" is a real barrier: a tagged
# release with no assets asks everyone who wants to try the tool to install a
# Go toolchain first. There is no cgo anywhere in this project, so every
# target cross-compiles from one runner in seconds.
on:
  push:
    tags: ['v*']
  # Runnable by hand against an existing tag, for when a release was published
  # before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v0.3.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The VCS stamp the toolchain embeds needs the history to be there.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # The tag is the version the binaries report, so a binary found on a
      # host years later can be matched to the source that produced it.
      - name: Resolve version
        id: v
        run: echo "version=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            for cmd in prober mosaic; do
              out="dist/streampulse-${cmd}_${VERSION}_${os}_${arch}"
              echo "building $out"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -trimpath \
                -ldflags "-s -w -X streampulse/internal/buildinfo.version=${VERSION}" \
                -o "$out" "./cmd/${cmd}"
            done
          done
          # One checksum file, so an operator can verify what they downloaded
          # without a second request per binary.
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Smoke-test the native binary
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          got=$("./dist/streampulse-prober_${VERSION}_linux_amd64" -version)
          echo "$got"
          # A binary that does not know its own version is the one bug this
          # workflow could plausibly ship, so it is checked before upload.
          case "$got" in
            *"$VERSION"*) ;;
            *) echo "::error::binary reports '$got', expected it to contain $VERSION"; exit 1 ;;
          esac

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
