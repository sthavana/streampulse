global:
  # The prober polls each target on its own schedule; scraping faster than it
  # polls only duplicates samples.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Uncomment once you have an Alertmanager to send to.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: streampulse
    static_configs:
      - targets: ["prober:9090"]
