# A working StreamPulse + Prometheus + Grafana stack, pointed at public test
# streams. From this directory:
#
#   docker compose up
#
#   prober UI       http://localhost:9090
#   prober metrics  http://localhost:9090/metrics
#   prometheus      http://localhost:9091
#   grafana         http://localhost:3000  (anonymous, no login)
#
# With the full overlay (make compose-up-full) the multiviewer joins them:
#
#   multiviewer     http://localhost:9092/mosaic
#
# Edit config.json to point at your own streams; the prober rereads it on
# restart, so `docker compose restart prober` picks up changes.

services:
  prober:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: streampulse
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config.json:/etc/streampulse/config.json:ro
    # Findings are JSON lines on stdout, so `docker compose logs -f prober` is
    # the event stream. Point a log shipper at it, or set slack_webhook in the
    # config.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: streampulse-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    depends_on:
      - prober

  grafana:
    image: grafana/grafana:11.1.0
    container_name: streampulse-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Demo stack: no login. Remove these three for anything real.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
